<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - AutoCare Service Hub</title>
  <meta name="description" content="Create your AutoCare Service Hub account to start booking vehicle services online." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-bg"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🚗</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join AutoCare Hub — It's free!</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <div class="form-icon-wrap">
            <span class="form-icon">👤</span>
            <input type="text" id="name" class="form-control" placeholder="John Doe" required autocomplete="name" />
          </div>
          <div class="form-error" id="nameError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="form-icon-wrap">
            <span class="form-icon">📧</span>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <div class="form-icon-wrap">
            <span class="form-icon">📱</span>
            <input type="tel" id="phone" class="form-control" placeholder="9876543210" autocomplete="tel" pattern="[0-9]{10}" maxlength="10" minlength="10" />
          </div>
          <div class="form-error" id="phoneError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="form-icon-wrap">
            <span class="form-icon">🔒</span>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required autocomplete="new-password" />
            <span class="form-icon" id="togglePass" style="right:1rem;left:auto;cursor:pointer;pointer-events:all;" onclick="togglePassword()">👁</span>
          </div>
          <div class="form-error" id="passwordError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="form-icon-wrap">
            <span class="form-icon">🔒</span>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required autocomplete="new-password" />
          </div>
          <div class="form-error" id="confirmError"></div>
        </div>

        <!-- Password strength indicator -->
        <div id="strengthBar" style="display:none;margin-bottom:1rem;">
          <div style="display:flex;gap:4px;margin-bottom:4px;">
            <div class="strength-seg" style="flex:1;height:4px;border-radius:2px;background:var(--border);transition:var(--transition);"></div>
            <div class="strength-seg" style="flex:1;height:4px;border-radius:2px;background:var(--border);transition:var(--transition);"></div>
            <div class="strength-seg" style="flex:1;height:4px;border-radius:2px;background:var(--border);transition:var(--transition);"></div>
            <div class="strength-seg" style="flex:1;height:4px;border-radius:2px;background:var(--border);transition:var(--transition);"></div>
          </div>
          <p id="strengthText" style="font-size:0.75rem;color:var(--text-muted);"></p>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;" id="registerBtn">
          Create Account
        </button>
      </form>

      <div class="auth-footer" style="margin-top:1.25rem;">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) window.location.href = '/dashboard.html';
    });

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('togglePass');
      if (input.type === 'password') { input.type = 'text'; icon.textContent = '🙈'; }
      else { input.type = 'password'; icon.textContent = '👁'; }
    }

    // Password strength
    document.getElementById('password').addEventListener('input', function() {
      const val = this.value;
      const bar = document.getElementById('strengthBar');
      const segs = document.querySelectorAll('.strength-seg');
      const text = document.getElementById('strengthText');
      if (!val) { bar.style.display = 'none'; return; }
      bar.style.display = 'block';

      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val) && /[^a-zA-Z0-9]/.test(val)) score++;

      const colors = ['var(--danger)', 'var(--warning)', 'var(--accent)', 'var(--success)'];
      const labels = ['Weak', 'Fair', 'Good', 'Strong'];
      segs.forEach((seg, i) => {
        seg.style.background = i < score ? colors[score - 1] : 'var(--border)';
      });
      text.textContent = labels[score - 1] || '';
      text.style.color = colors[score - 1] || 'var(--text-muted)';
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('registerBtn');

      ['nameError','emailError','phoneError','passwordError','confirmError'].forEach(id => {
        document.getElementById(id).textContent = '';
      });

      let valid = true;
      if (!name) { document.getElementById('nameError').textContent = 'Name is required'; valid = false; }
      if (!email || !/\S+@\S+\.\S+/.test(email)) { document.getElementById('emailError').textContent = 'Valid email is required'; valid = false; }
      if (phone && !/^\d{10}$/.test(phone)) { document.getElementById('phoneError').textContent = 'Phone number must be exactly 10 digits'; valid = false; }
      if (password.length < 6) { document.getElementById('passwordError').textContent = 'Password must be at least 6 characters'; valid = false; }
      if (password !== confirm) { document.getElementById('confirmError').textContent = 'Passwords do not match'; valid = false; }
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating Account...';

      const res = await apiRequest('/auth/register', 'POST', { name, email, phone, password });

      if (res.ok && res.data.success) {
        Auth.setSession(res.data.token, res.data.user);
        Toast.success('Account created! Redirecting...');
        setTimeout(() => window.location.href = '/dashboard.html', 1000);
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
        Toast.error(res.data.message || 'Registration failed. Please try again.');
      }
    });
  </script>
</body>
</html>

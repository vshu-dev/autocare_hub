<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AutoCare Service Hub</title>
  <meta name="description" content="Login to your AutoCare Service Hub account to manage your vehicle service bookings." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-bg"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🚗</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your AutoCare account</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="form-icon-wrap">
            <span class="form-icon">📧</span>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="form-icon-wrap">
            <span class="form-icon">🔒</span>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" />
            <span class="form-icon" id="togglePass" style="right:1rem;left:auto;cursor:pointer;pointer-events:all;" onclick="togglePassword()">👁</span>
          </div>
          <div class="form-error" id="passwordError"></div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;" id="loginBtn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create one free</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
  <script>
    // Redirect if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        const user = Auth.getUser();
        window.location.href = user?.role === 'admin' ? '/admin-dashboard.html' : '/dashboard.html';
      }
    });

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('togglePass');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
      } else {
        input.type = 'password';
        icon.textContent = '👁';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      // Clear errors
      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';

      let valid = true;
      if (!email) { document.getElementById('emailError').textContent = 'Email is required'; valid = false; }
      if (!password) { document.getElementById('passwordError').textContent = 'Password is required'; valid = false; }
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing In...';

      const res = await apiRequest('/auth/login', 'POST', { email, password });

      if (res.ok && res.data.success) {
        Auth.setSession(res.data.token, res.data.user);
        Toast.success('Login successful! Redirecting...');
        setTimeout(() => {
          window.location.href = res.data.user.role === 'admin' ? '/admin-dashboard.html' : '/dashboard.html';
        }, 1000);
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
        Toast.error(res.data.message || 'Login failed. Please try again.');
      }
    });
  </script>
</body>
</html>
